method_id: M0
name: zero_shot_structured_llm
display_name: M0 Zero-shot structured LLM

description: >
  Minimal structured LLM baseline. The model receives the diagnostic task,
  candidate labels, allowed schema, and action ontology, but no diagnostic
  evidence table or source-use workflow.

llm_input:
  include_task_context: true
  include_allowed_schema: true
  include_action_ontology: true
  include_proxy_evidence_table: false
  include_static_summary: false
  expose_gold_label: false
  expose_supports: false

harness_components:
  source_policy: false
  static_summary: false
  tool_source_access: false
  diagnostic_evidence_table: false
  deterministic_verifier: false
  action_validity_filter: false
  repair_loop: false

output_constraints:
  structured_output_schema: true
  require_predicted_label: true
  require_evidence: true
  require_next_steps: true
  require_limitations: true

cost_behavior:
  expected_source_access_count: 0
  expected_tool_call_count: 0
  allow_repair_call: false

role_in_experiment: baseline