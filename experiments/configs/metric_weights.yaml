# Metric weights for M4 candidate selection.
# These weights instantiate the J_mfg objective used for validation selection.
#
# J_mfg =
#   alpha_label   * S_label
# + beta_evidence * S_evid
# + gamma_action  * S_action
# - lambda_unsupported * U_op
# - mu_cost * C_deploy
# - rho_repair_failure * F10

objective_name: J_mfg
objective_version: paper_j_v1_no_generic
evaluation_policy_version: observable_checks_v4
empty_denominator_policy:
  reporting_precision_when_no_generated_evidence: 0.0
  reporting_recall_when_no_required_evidence: null
  reporting_action_link_ratio_when_no_actions: null
  reporting_unsafe_when_no_actions: 0.0
  selection_recall_when_all_reports_undefined: 0.0
  selection_action_credit_when_no_actions: 0.0
  coverage_must_be_reported: true

primary_selection:
  alpha_label: 1.0
  beta_evidence: 1.0
  gamma_action: 1.0
  lambda_unsupported: 1.0
  lambda_unsafe: 1.0
  mu_cost: 1.0
  rho_repair_failure: 1.0

metric_mapping:
  S_label: mean_label_correctness  # Paper Eq. J_mfg; macro-F1 is separately monitored.
  S_evid:
    type: mean
    metrics:
      - evidence_precision
      - evidence_recall
  S_action: evidence_linked_action_ratio
  U_unsupported: unsupported_claim_rate
  U_unsafe: unsafe_recommendation_rate
  C_deploy: cost_per_report
  repair_failure: F10

screening_only_metrics:
  - generic_action_rate

normalization:
  enabled: true
  cost:
    method: divide_by_reference
    reference_cost_per_report: 0.005
    clip_min: 0.0
    clip_max: 1.0

  failure_rates:
    already_normalized: true

tie_breaking:
  order:
    - lower_unsafe_recommendation_rate
    - lower_unsupported_claim_rate
    - lower_cost_per_report

reporting_metrics_body:
  main:
    - macro_f1
    - evidence_precision
    - evidence_recall
    - unsupported_claim_rate
    - unsafe_recommendation_rate
    - generic_action_rate
    - cost_per_report

  component:
    - evidence_recall
    - source_hallucination_rate
    - temporal_violation_rate
    - evidence_linked_action_ratio
    - unsafe_recommendation_rate
    - causal_overclaim_rate

  failure_trace:
    - F1
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    - F8
    - F9
    - F10

appendix_only_metrics:
  - schema_valid
  - repair_count
  - input_tokens
  - output_tokens
  - latency_sec
  - source_access_count
  - tool_call_count
